<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar Mediciones - NutriVida</title>
  <link rel="icon" type="image/jpeg" href="NutriVida.jpg">

  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand" href="LoginNutrivida.html">Clínica NutriVida</a>
    </div>
  </nav>
  <div class="container">
    
    <h1>Nueva Ficha Clínica</h1>
    
    <div class="card">
        <h2>Ingreso de Mediciones Físicas</h2>
        <p>Registra los indicadores antropométricos del paciente al finalizar su control.</p>
        
        <form id="form-mediciones">
            
            <div class="form-group">
                <label for="paciente-select">Paciente en Atención:</label>
                <select id="paciente-select" required>
                    <option value="">-- Selecciona el paciente --</option>
                    <option value="1">Rodrigo Rojas</option>
                    <option value="2">Julia González</option>
                    <option value="3">Juan Pérez</option>
                </select>
            </div>

            <div class="form-group-row">
                <div class="form-group">
                    <label for="fecha-medicion">Fecha de Control:</label>
                    <input type="date" id="fecha-medicion" required>
                </div>
            </div>

            <div class="form-group-row">
                <div class="form-group">
                    <label for="peso">Peso (kg):</label>
                    <input type="number" step="0.1" id="peso" placeholder="Ej: 75.5" required>
                </div>
                <div class="form-group">
                    <label for="estatura">Estatura (cm):</label>
                    <input type="number" id="estatura" placeholder="Ej: 175" required>
                </div>
                <div class="form-group">
                    <label for="cintura">Cintura (cm):</label>
                    <input type="number" step="0.1" id="cintura" placeholder="Ej: 90" required>
                </div>
            </div>

            <div class="form-group">
                <label for="observaciones">Observaciones Clínicas:</label>
                <textarea id="observaciones" rows="4" style="width: 100%; border: 1px solid #ccc; border-radius: 4px; padding: 10px; font-family: inherit;" placeholder="Anota aquí las recomendaciones, cambios en la dieta o comentarios sobre el progreso..."></textarea>
            </div>

            <div style="display: flex; gap: 15px; margin-top: 20px;">
                <button type="submit" class="btn-red" style="width: auto;">Guardar Mediciones</button>
                <button type="button" class="btn-red" style="width: auto; background-color: #555555;" onclick="window.location.href='nutricionista.html'">Cancelar / Volver</button>
            </div>
        </form>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
